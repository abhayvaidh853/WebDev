<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="01_absolute_vs_relative.css">
</head>
<body>
    
    <h2>CSS Units: px, em, rem</h2>
    <p class="px-text">This text is 24px.</p>
    <p class="rem-text">This text is 2rem (32px).</p>
    <div class="parent">
        Parent div (20px font-size).
        <p class="em-text">This text is 2em (40px based on parent).</p>
    </div>

</body>
</html>
