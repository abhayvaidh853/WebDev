<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Weather Card</title>
    <link rel="stylesheet" href="weather2.css">
</head>
<body>

<div class="card">

    <div class="left">
        <div class="icon">⛅</div>
        <h1>28°C</h1>
        <h2>Mumbai</h2>
        <p>Partly Cloudy</p>
    </div>

    <div class="right">
        <div class="info">
            <span>💧 Humidity</span>
            <strong>72%</strong>
        </div>

        <div class="info">
            <span>🌬 Wind</span>
            <strong>15 km/h</strong>
        </div>

        <div class="info">
            <span>🌡 Feels Like</span>
            <strong>31°C</strong>
        </div>

        <div class="info">
            <span>👁 Visibility</span>
            <strong>10 km</strong>
        </div>
    </div>

</div>



</body>
</html>
